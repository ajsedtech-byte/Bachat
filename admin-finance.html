<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance — Bachat</title>
  <link rel="icon" href="/assets/bachat-logo-light.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="payments">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <div class="mb-6"><h1 class="text-2xl font-extrabold">Finance / Payments</h1><p class="text-sm text-slate-500 mt-1">GMV, commissions, payouts — demo surface.</p></div>
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">GMV This Month</p><p class="text-xl font-extrabold">₹2,48,37,920</p><p class="text-xs text-green-600">+18.6%</p></div>
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Platform Revenue</p><p class="text-xl font-extrabold">₹7,42,680</p><p class="text-xs text-green-600">+22.4%</p></div>
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Pending Settlements</p><p class="text-xl font-extrabold text-amber-600">₹18,76,430</p><p class="text-xs text-amber-600">+8.1%</p></div>
        </div>
        <div class="rounded-xl bg-white border border-[#e5e7eb] shadow-sm overflow-hidden"><div class="px-5 py-4 border-b font-bold">Recent transactions</div><table class="w-full text-sm"><thead class="bg-[#f8f9fb] text-xs uppercase font-bold text-slate-500 text-left"><tr><th class="px-5 py-3">Txn</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Amount</th><th class="px-5 py-3">Status</th></tr></thead><tbody class="divide-y"><tr><td class="px-5 py-3 font-mono text-[#0056d2]">TXN-8812</td><td class="px-5 py-3">Payment</td><td class="px-5 py-3 font-semibold">₹4,299</td><td class="px-5 py-3"><span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-full">Success</span></td></tr></tbody></table></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
