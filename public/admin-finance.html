<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finance — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="payments">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Finance</h1>
        <p class="text-slate-500 text-sm mt-1">Aggregates from orders — <code class="text-xs bg-slate-100 px-1 rounded">GET /api/admin/finance-summary</code></p>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div id="grid" class="hidden mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        <div id="payments-card" class="hidden mt-6 rounded-xl border border-[#e5e7eb] bg-white shadow-sm overflow-hidden"></div>
        <div id="raw" class="hidden mt-6 rounded-xl border border-[#e5e7eb] bg-white p-4 text-xs font-mono overflow-x-auto"></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script>
    (function () {
      function inr(n) {
        return "₹" + (Number(n) || 0).toLocaleString("en-IN");
      }
      (async function () {
        if (!(await BachatAdminRuntime.guardAdminPage())) return;
        var err = document.getElementById("err");
        var res = await BachatAdminRuntime.adminFetch("/api/admin/finance-summary", { headers: BachatAdminRuntime.authHeaders() });
        var d = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          err.textContent = d.error || "Failed";
          err.classList.remove("hidden");
          return;
        }
        var g = document.getElementById("grid");
        g.innerHTML =
          '<div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500 uppercase">Paid revenue</p><p class="text-2xl font-extrabold mt-2 text-[#0056d2]">' +
          inr(d.paid_revenue_inr) +
          '</p><p class="text-sm text-slate-500 mt-1">' + (d.paid_orders || 0) + ' paid orders</p></div>' +
          '<div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500 uppercase">Seller payable</p><p class="text-2xl font-extrabold mt-2 text-emerald-700">' +
          inr(d.seller_payable_inr) +
          '</p><p class="text-sm text-slate-500 mt-1">Commission ' + inr(d.seller_commission_inr) + '</p></div>' +
          '<div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500 uppercase">Failed payments</p><p class="text-2xl font-extrabold mt-2 text-red-700">' +
          (d.failed_payment_orders || 0) +
          '</p><p class="text-sm text-slate-500 mt-1">' + inr(d.failed_payment_value_inr) + '</p></div>' +
          '<div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500 uppercase">Refunds</p><p class="text-2xl font-extrabold mt-2 text-amber-700">' +
          inr(d.refunds_value_inr) +
          '</p><p class="text-sm text-slate-500 mt-1">' + (d.refunds_count || 0) + ' orders</p></div>';
        g.classList.remove("hidden");
        var recent = Array.isArray(d.recent_payments) ? d.recent_payments : [];
        var pc = document.getElementById("payments-card");
        pc.innerHTML =
          '<div class="px-4 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-extrabold">Payment reconciliation</h2><p class="text-sm text-slate-500">Recent provider IDs, payment status, and order status.</p></div><button id="finance-export" class="rounded-lg border border-[#0056d2] text-[#0056d2] font-bold px-3 py-2 text-sm">Export CSV</button></div>' +
          '<div class="overflow-x-auto"><table class="min-w-[900px] w-full text-sm text-left"><thead class="bg-[#f8f9fb] text-slate-500"><tr><th class="px-4 py-2">Order</th><th class="px-4 py-2">Amount</th><th class="px-4 py-2">Payment</th><th class="px-4 py-2">Order status</th><th class="px-4 py-2">Provider order</th><th class="px-4 py-2">Provider payment</th><th class="px-4 py-2">Updated</th></tr></thead><tbody>' +
          (recent.length ? recent.map(function (p) {
            return '<tr class="border-t border-slate-200"><td class="px-4 py-2 font-semibold">' + (p.order_id || '—') + '</td><td class="px-4 py-2">' + inr(p.amount) + '</td><td class="px-4 py-2">' + (p.status || p.order_payment_status || '—') + '</td><td class="px-4 py-2">' + (p.order_status || '—') + '</td><td class="px-4 py-2 text-slate-500">' + (p.provider_order_id || '—') + '</td><td class="px-4 py-2 text-slate-500">' + (p.provider_payment_id || '—') + '</td><td class="px-4 py-2 text-slate-500">' + String(p.updated_at || '').slice(0, 16) + '</td></tr>';
          }).join('') : '<tr><td colspan="7" class="px-4 py-8 text-slate-500">No payment records yet.</td></tr>') +
          '</tbody></table></div>';
        pc.classList.remove("hidden");
        document.getElementById("finance-export").addEventListener("click", function () {
          var cols = ["payment_id", "order_id", "amount", "status", "provider_order_id", "provider_payment_id", "order_payment_status", "order_status", "updated_at"];
          var csv = [cols.join(",")].concat(recent.map(function (r) {
            return cols.map(function (c) { return '"' + String(r[c] == null ? "" : r[c]).replace(/"/g, '""') + '"'; }).join(",");
          })).join("\n");
          var url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
          var a = document.createElement("a");
          a.href = url;
          a.download = "bachat-payment-reconciliation.csv";
          a.click();
          URL.revokeObjectURL(url);
        });
        document.getElementById("raw").textContent = JSON.stringify(d, null, 2);
        document.getElementById("raw").classList.remove("hidden");
      })();
    })();
  </script>
</body>
</html>
