<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finance — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="payments">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Finance</h1>
        <p class="text-slate-500 text-sm mt-1">Aggregates from orders — <code class="text-xs bg-slate-100 px-1 rounded">GET /api/admin/finance-summary</code></p>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div id="grid" class="hidden mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        <div id="raw" class="hidden mt-6 rounded-xl border border-[#e5e7eb] bg-white p-4 text-xs font-mono overflow-x-auto"></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script>
    (function () {
      function inr(n) {
        return "₹" + (Number(n) || 0).toLocaleString("en-IN");
      }
      (async function () {
        if (!(await BachatAdminRuntime.guardAdminPage())) return;
        var err = document.getElementById("err");
        var res = await BachatAdminRuntime.adminFetch("/api/admin/finance-summary", { headers: BachatAdminRuntime.authHeaders() });
        var d = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          err.textContent = d.error || "Failed";
          err.classList.remove("hidden");
          return;
        }
        var g = document.getElementById("grid");
        g.innerHTML =
          '<div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500">Paid revenue (INR)</p><p class="text-2xl font-extrabold mt-2 text-[#0056d2]">' +
          inr(d.paid_revenue_inr) +
          '</p></div><div class="rounded-xl bg-white border border-[#e5e7eb] p-5 shadow-sm"><p class="text-xs font-semibold text-slate-500">Paid orders</p><p class="text-2xl font-extrabold mt-2">' +
          (d.paid_orders || 0) +
          '</p></div>';
        g.classList.remove("hidden");
        document.getElementById("raw").textContent = JSON.stringify(d, null, 2);
        document.getElementById("raw").classList.remove("hidden");
      })();
    })();
  </script>
</body>
</html>
