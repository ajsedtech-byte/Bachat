<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Bachat</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="support">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <div class="flex flex-wrap justify-between gap-4 mb-6"><div><h1 class="text-2xl font-extrabold">Support Dashboard</h1><p class="text-sm text-slate-500 mt-1">Monitor and resolve customer &amp; seller issues.</p></div></div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Open Tickets</p><p class="text-2xl font-extrabold text-[#0056d2]">128</p><p class="text-xs text-green-600">+12%</p></div>
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">In Progress</p><p class="text-2xl font-extrabold">76</p><p class="text-xs text-amber-600">+8%</p></div>
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Resolved Today</p><p class="text-2xl font-extrabold text-green-700">142</p><p class="text-xs text-green-600">+18%</p></div>
          <div class="rounded-xl bg-white border border-[#e5e7eb] p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Avg Resolution</p><p class="text-2xl font-extrabold">4h 32m</p><p class="text-xs text-purple-600">-6%</p></div>
        </div>
        <div class="rounded-xl bg-white border border-[#e5e7eb] shadow-sm overflow-hidden">
          <div class="px-5 py-4 border-b font-bold">Recent tickets</div>
          <table class="w-full text-sm"><thead class="bg-[#f8f9fb] text-left text-xs uppercase text-slate-500 font-bold"><tr><th class="px-5 py-3">ID</th><th class="px-5 py-3">Issue</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Priority</th></tr></thead>
          <tbody class="divide-y divide-[#e5e7eb]"><tr><td class="px-5 py-3 font-mono text-[#0056d2]">TKT-2521</td><td class="px-5 py-3">Payment pending</td><td class="px-5 py-3"><span class="px-2 py-1 rounded-full bg-blue-100 text-blue-800 text-xs font-bold">Open</span></td><td class="px-5 py-3"><span class="text-red-600 font-bold text-xs">High</span></td></tr>
          <tr><td class="px-5 py-3 font-mono text-[#0056d2]">TKT-2518</td><td class="px-5 py-3">Delivery delay</td><td class="px-5 py-3"><span class="px-2 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">Progress</span></td><td class="px-5 py-3"><span class="text-amber-600 font-bold text-xs">Medium</span></td></tr></tbody></table>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
