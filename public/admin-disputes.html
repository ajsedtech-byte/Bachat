<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disputes — Bachat</title>
  <link rel="icon" href="/assets/bachat-logo-light.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="disputes">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <div class="mb-6"><h1 class="text-2xl font-extrabold">Dispute / Resolution</h1><p class="text-sm text-slate-500 mt-1">Refunds, damaged goods, seller issues — demo UI.</p></div>
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Open Disputes</p><p class="text-2xl font-extrabold text-[#0056d2]">156</p></div>
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Refund Requested</p><p class="text-xl font-extrabold">₹1,24,850</p></div>
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500 font-semibold">Resolved (mo)</p><p class="text-2xl font-extrabold text-green-700">243</p></div>
        </div>
        <div class="rounded-xl bg-white border shadow-sm p-5"><p class="font-bold mb-4">Recent disputes</p><div class="space-y-3 text-sm"><div class="flex justify-between border-b pb-2"><span class="font-mono text-[#0056d2]">DSP-1042</span><span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded-full font-bold">Review</span></div></div></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
