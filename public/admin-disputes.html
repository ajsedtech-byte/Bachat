<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disputes — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="disputes">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Dispute signals</h1>
        <p class="text-slate-500 text-sm mt-1 max-w-3xl">Until a dedicated dispute model exists, this list surfaces orders with <strong>failed/refunded</strong> payments or <strong>cancelled</strong> fulfilment — <code class="text-xs bg-slate-100 px-1 rounded">GET /api/admin/dispute-signals</code></p>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div class="mt-6 overflow-x-auto rounded-xl border border-[#e5e7eb] bg-white shadow-sm">
          <table class="w-full text-sm text-left min-w-[800px]">
            <thead class="bg-[#f8f9fb] text-xs font-bold text-slate-500 uppercase border-b border-[#e5e7eb]">
              <tr>
                <th class="px-4 py-3">Order</th>
                <th class="px-4 py-3">Buyer</th>
                <th class="px-4 py-3">Amount</th>
                <th class="px-4 py-3">Payment</th>
                <th class="px-4 py-3">Order status</th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-[#e5e7eb]"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script>
    (function () {
      function esc(s) {
        var t = document.createElement("div");
        t.textContent = s == null ? "" : String(s);
        return t.innerHTML;
      }
      function inr(n) {
        return "₹" + (Number(n) || 0).toLocaleString("en-IN");
      }
      (async function () {
        if (!(await BachatAdminRuntime.guardAdminPage())) return;
        var err = document.getElementById("err");
        var res = await BachatAdminRuntime.adminFetch("/api/admin/dispute-signals", { headers: BachatAdminRuntime.authHeaders() });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          err.textContent = data.error || "Failed";
          err.classList.remove("hidden");
          return;
        }
        var tb = document.getElementById("tbody");
        tb.innerHTML = "";
        if (!(data.items && data.items.length)) {
          tb.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">No flagged orders right now.</td></tr>';
          return;
        }
        data.items.forEach(function (o) {
          var tr = document.createElement("tr");
          tr.className = "hover:bg-[#f8f9fb]";
          tr.innerHTML =
            "<td class=\"px-4 py-3 font-mono text-xs\">" +
            esc(o.order_id) +
            "</td><td class=\"px-4 py-3\">" +
            esc(o.user_name) +
            "</td><td class=\"px-4 py-3 font-bold\">" +
            inr(o.total_amount) +
            "</td><td class=\"px-4 py-3\">" +
            esc(o.payment_status) +
            "</td><td class=\"px-4 py-3\">" +
            esc(o.order_status) +
            "</td>";
          tb.appendChild(tr);
        });
      })();
    })();
  </script>
</body>
</html>
