<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bachat - Home</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <style>
    :root {
      color-scheme: light;
      --navy: #131921;
      --accent: #febd69;
      --paper: #f8f9fb;
      --ink: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .bridge {
      width: min(92vw, 460px);
      border: 1px solid #dbe3ef;
      border-radius: 18px;
      background: #fff;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
    }

    .bridge img {
      height: 42px;
      width: auto;
      margin-bottom: 18px;
    }

    .bridge h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .bridge p {
      margin: 10px 0 0;
      color: #526174;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.6;
    }

    .bridge a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #111827;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="bridge">
    <img src="/assets/bachat-logo.svg" alt="Bachat" />
    <h1>Opening Bachat Home</h1>
    <p>The customer home page is now the Amazon-style shopping experience.</p>
    <a href="/UserDashboard.html#shopping-home">Open home</a>
  </main>
  <script>
    location.replace("/UserDashboard.html#shopping-home");
  </script>
</body>
</html>
