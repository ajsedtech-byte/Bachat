<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Bachat</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <link rel="stylesheet" href="/assets/tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="/js/bachat-lazy-load.js"></script>
</head>
<body class="bachat-ui min-h-screen bg-[#f8f9fa] text-slate-900 flex flex-col items-center justify-center px-4 py-10">
  <div class="max-w-md w-full bg-white rounded-2xl border border-[#e5e7eb] shadow-xl p-6 sm:p-8">
    <a href="/login.html" class="inline-block mb-4 text-sm font-bold text-[#0056d2]">← Back to login</a>
    <a href="/" class="block mb-2"><img src="/assets/bachat-logo.svg" alt="Bachat" class="h-9 w-auto" decoding="async" /></a>
    <h1 class="text-xl font-extrabold text-slate-900">Set a new password</h1>
    <p class="text-sm text-slate-600 mt-2">Use the 6-digit code from your email (valid 15 minutes) and choose a new password (at least 8 characters).</p>
    <p id="msg" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></p>
    <form id="form" class="mt-5 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-[#e5e7eb] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#0056d2]/25 focus:border-[#0056d2]" placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">6-digit code</label>
        <input name="code" maxlength="6" inputmode="numeric" required autocomplete="one-time-code" class="w-full text-center text-2xl font-mono tracking-widest rounded-xl border border-[#e5e7eb] px-4 py-3 outline-none focus:ring-2 focus:ring-[#0056d2]/25" placeholder="000000" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New password</label>
        <input name="new_password" type="password" minlength="8" required autocomplete="new-password" class="w-full rounded-xl border border-[#e5e7eb] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#0056d2]/25" placeholder="At least 8 characters" />
      </div>
      <button type="submit" id="btn" class="w-full rounded-xl bg-[#0056d2] hover:bg-[#0044a8] text-white font-extrabold py-3 text-sm disabled:opacity-50">Update password</button>
    </form>
    <p class="text-xs text-slate-500 mt-6 text-center">
      Need a code? <a class="text-[#0056d2] font-bold" href="/forgot-password.html">Send reset email</a>
    </p>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var em = p.get("email");
      if (em) document.getElementById("email").value = em;
    })();
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");
      msg.classList.add("hidden");
      btn.disabled = true;
      try {
        var fd = new FormData(e.target);
        var res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: String(fd.get("email") || "").trim(),
            code: String(fd.get("code") || "").trim(),
            new_password: String(fd.get("new_password") || ""),
          }),
        });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) throw new Error(data.error || "Reset failed");
        msg.textContent = data.message || "Success. Redirecting…";
        msg.className = "mt-4 text-sm rounded-lg px-3 py-2 bg-emerald-50 text-emerald-900 border border-emerald-100";
        msg.classList.remove("hidden");
        setTimeout(function () {
          location.href = "/login.html";
        }, 1200);
      } catch (x) {
        msg.textContent = x.message || "Error";
        msg.className = "mt-4 text-sm rounded-lg px-3 py-2 bg-red-50 text-red-800 border border-red-100";
        msg.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
