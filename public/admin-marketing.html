<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Growth — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <link rel="stylesheet" href="/assets/tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="/js/bachat-lazy-load.js"></script>
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="marketing">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Marketing / referrals</h1>
        <p class="text-slate-500 text-sm mt-1"><code class="text-xs bg-slate-100 px-1 rounded">GET /api/admin/marketing-summary</code></p>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div id="box" class="hidden mt-6 rounded-xl border border-[#e5e7eb] bg-white p-6 shadow-sm max-w-lg"></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script>
    (async function () {
      if (!(await BachatAdminRuntime.guardAdminPage())) return;
      var err = document.getElementById("err");
      var res = await BachatAdminRuntime.adminFetch("/api/admin/marketing-summary", { headers: BachatAdminRuntime.authHeaders() });
      var d = await res.json().catch(function () {
        return {};
      });
      if (!res.ok) {
        err.textContent = d.error || "Failed";
        err.classList.remove("hidden");
        return;
      }
      document.getElementById("box").innerHTML =
        "<p class=\"text-sm\"><span class=\"font-bold\">Buyers:</span> " +
        d.buyers_total +
        "</p><p class=\"text-sm mt-2\"><span class=\"font-bold\">Signups with referrer:</span> " +
        d.signups_with_referrer +
        "</p><p class=\"text-xs text-slate-500 mt-4\">" +
        (d.note || "") +
        "</p>";
      document.getElementById("box").classList.remove("hidden");
    })();
  </script>
</body>
</html>
