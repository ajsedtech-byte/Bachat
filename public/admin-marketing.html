<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth — Bachat</title>
  <link rel="icon" href="/assets/bachat-logo-light.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="marketing">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Marketing / Growth</h1><p class="text-sm text-slate-500 mt-1">Campaigns, referrals, coupons — demo metrics.</p>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500">New users</p><p class="text-2xl font-extrabold">2,842</p></div>
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500">Referrals</p><p class="text-2xl font-extrabold">542</p></div>
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500">CAC</p><p class="text-2xl font-extrabold">₹182</p></div>
          <div class="rounded-xl bg-white border p-4 shadow-sm"><p class="text-xs text-slate-500">Repeat rate</p><p class="text-2xl font-extrabold">28.6%</p></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
