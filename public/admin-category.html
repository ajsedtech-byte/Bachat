<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Bachat</title>
  <link rel="icon" href="/assets/bachat-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="category">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Category Manager</h1><p class="text-sm text-slate-500 mt-1">Conversion &amp; price variance by category — demo.</p>
        <div class="mt-6 rounded-xl bg-white border shadow-sm overflow-hidden"><table class="w-full text-sm"><thead class="bg-[#f8f9fb] text-xs uppercase font-bold text-slate-500 text-left"><tr><th class="px-5 py-3">Category</th><th class="px-5 py-3">Requests</th><th class="px-5 py-3">Conv.</th><th class="px-5 py-3">GMV</th></tr></thead><tbody class="divide-y"><tr><td class="px-5 py-3 font-semibold">Computer Hardware</td><td class="px-5 py-3">1,240</td><td class="px-5 py-3 text-green-600 font-bold">38%</td><td class="px-5 py-3">₹18.2L</td></tr><tr><td class="px-5 py-3 font-semibold">Mobile Accessories</td><td class="px-5 py-3">982</td><td class="px-5 py-3">34%</td><td class="px-5 py-3">₹9.8L</td></tr></tbody></table></div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
