<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Bachat</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui min-h-screen bg-[#f8f9fa] text-slate-900 flex flex-col items-center justify-center px-4 py-10">
  <div class="max-w-md w-full bg-white rounded-2xl border border-[#e5e7eb] shadow-xl p-6 sm:p-8">
    <a href="/login.html" class="inline-block mb-4 text-sm font-bold text-[#0056d2]">← Back to login</a>
    <a href="/" class="block mb-2"><img src="/assets/bachat-logo.svg" alt="Bachat" class="h-9 w-auto" /></a>
    <h1 class="text-xl font-extrabold text-slate-900">Forgot password</h1>
    <p class="text-sm text-slate-600 mt-2">Enter the email on your account. If it exists and is verified, we send a 6-digit reset code.</p>
    <p id="msg" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></p>
    <form id="form" class="mt-5 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
        <input name="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-[#e5e7eb] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#0056d2]/25 focus:border-[#0056d2]" placeholder="you@example.com" />
      </div>
      <button type="submit" id="btn" class="w-full rounded-xl bg-[#0056d2] hover:bg-[#0044a8] text-white font-extrabold py-3 text-sm disabled:opacity-50">Send reset code</button>
    </form>
    <p class="text-xs text-slate-500 mt-6 text-center">
      Then <a class="text-[#0056d2] font-bold" href="/reset-password.html">set a new password</a> with the code from your inbox.
    </p>
  </div>
  <script>
    async function api(path, body) {
      var res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      return res;
    }
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");
      msg.classList.add("hidden");
      btn.disabled = true;
      try {
        var fd = new FormData(e.target);
        var res = await api("/api/auth/forgot-password", { email: String(fd.get("email") || "").trim() });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) throw new Error(data.error || "Request failed");
        msg.textContent = data.message || "Check your email.";
        msg.className = "mt-4 text-sm rounded-lg px-3 py-2 bg-[#e8f1fc] text-[#0044a8] border border-[#0056d2]/20";
        msg.classList.remove("hidden");
      } catch (x) {
        msg.textContent = x.message || "Error";
        msg.className = "mt-4 text-sm rounded-lg px-3 py-2 bg-red-50 text-red-800 border border-red-100";
        msg.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
