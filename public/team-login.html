<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Access — Bachat</title>
  <link rel="icon" href="/assets/bachat-logo-light.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui min-h-screen grid lg:grid-cols-2 bg-[#f8f9fb]">
  <div class="hidden lg:flex flex-col justify-between p-12 xl:p-16 bg-gradient-to-br from-[#0056d2] to-[#003d99] text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 w-96 h-96 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
    <div class="relative z-10">
      <img src="/assets/bachat-logo.png" alt="" class="h-20 w-auto max-w-xs object-contain mb-8 drop-shadow-lg" />
      <h1 class="text-3xl xl:text-4xl font-extrabold leading-tight">Team Access Portal</h1>
      <p class="mt-4 text-white/90 max-w-md">One platform. Real-time requests. Trusted by teams across India.</p>
    </div>
    <div class="relative z-10 grid grid-cols-3 gap-4 text-center text-xs font-semibold text-white/85">
      <div>🛡<br/>Secure</div>
      <div>🔐<br/>Role-based</div>
      <div>⏱<br/>Real-time</div>
    </div>
  </div>
  <div class="flex flex-col justify-center p-6 sm:p-10">
    <div class="max-w-md mx-auto w-full bg-white rounded-2xl border border-[#e5e7eb] shadow-xl p-8">
      <p class="text-center text-2xl mb-1">🛡</p>
      <h2 class="text-xl font-extrabold text-center text-slate-900">Welcome back</h2>
      <p class="text-sm text-slate-500 text-center mt-1">Sign in to your Bachat account</p>
      <p id="err" class="hidden mt-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>
      <form id="team-login-form" class="mt-6 space-y-4">
        <div>
          <p class="text-xs font-bold text-slate-500 uppercase mb-2">Select role</p>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-role-tab="buyer" class="role-tab rounded-xl border-2 border-[#0056d2] bg-[#e8f1fc] py-2 text-xs font-bold text-[#0056d2]">Sales</button>
            <button type="button" data-role-tab="seller" class="role-tab rounded-xl border border-[#e5e7eb] py-2 text-xs font-bold text-slate-500">Ops</button>
            <button type="button" data-role-tab="admin" class="role-tab rounded-xl border border-[#e5e7eb] py-2 text-xs font-bold text-slate-500">Admin</button>
          </div>
          <input type="hidden" name="role" id="team-role" value="buyer" />
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase">Work email</label>
          <input name="email" type="email" required class="mt-1 w-full rounded-xl border border-[#e5e7eb] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#0056d2]/25 focus:border-[#0056d2]" placeholder="you@company.com" />
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase">Password</label>
          <input name="password" type="password" required class="mt-1 w-full rounded-xl border border-[#e5e7eb] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#0056d2]/25" />
        </div>
        <button type="submit" class="w-full rounded-xl bg-[#0056d2] text-white font-bold py-3 hover:bg-[#0044a8]">Continue</button>
      </form>
      <p class="text-xs text-slate-400 text-center mt-6">2FA &amp; SSO can be wired to your IdP.</p>
    </div>
    <p class="text-center text-[11px] text-slate-400 mt-8">Internal use — same credentials as <a href="/login.html" class="text-[#0056d2] font-semibold">customer login</a> for demo.</p>
  </div>
  <script>
    (function () {
      var roleIn = document.getElementById("team-role");
      document.querySelectorAll(".role-tab").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".role-tab").forEach(function (b) {
            b.className = "role-tab rounded-xl border border-[#e5e7eb] py-2 text-xs font-bold text-slate-500";
          });
          btn.className = "role-tab rounded-xl border-2 border-[#0056d2] bg-[#e8f1fc] py-2 text-xs font-bold text-[#0056d2]";
          roleIn.value = btn.getAttribute("data-role-tab") || "buyer";
        });
      });
      document.getElementById("team-login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("err");
        err.classList.add("hidden");
        var fd = new FormData(e.target);
        var role = String(fd.get("role") || "buyer");
        var body = { email: String(fd.get("email") || "").trim(), password: String(fd.get("password") || "") };
        try {
          var res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || "Login failed");
          var actual = data.user && data.user.role;
          if (role === "admin" && actual !== "admin") throw new Error("Not an admin account.");
          if (role === "seller" && actual !== "seller") throw new Error("Not a shopkeeper account.");
          if (role === "buyer" && actual !== "buyer" && actual !== "admin") throw new Error("Not a buyer account.");
          localStorage.setItem("ajs_token", data.token);
          localStorage.setItem("ajs_user", JSON.stringify(data.user || null));
          if (actual === "admin") location.href = "/AdminDashboard.html";
          else if (actual === "seller") location.href = "/ShopkeeperDashboard.html";
          else location.href = "/UserDashboard.html";
        } catch (x) {
          err.textContent = x.message || "Error";
          err.classList.remove("hidden");
        }
      });
    })();
  </script>
</body>
</html>
