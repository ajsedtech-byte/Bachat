<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Sales — Bachat</title>
  <link rel="icon" href="/assets/bachat-logo-light.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="sales">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <div class="flex flex-wrap justify-between gap-4"><h1 class="text-2xl font-extrabold">Bachat Sales — Field</h1><button type="button" class="px-4 py-2 rounded-xl bg-[#0056d2] text-white text-sm font-bold">+ Add shopkeeper</button></div>
        <p class="text-sm text-slate-500 mt-1">Leads, visits, KYC — demo pipeline.</p>
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mt-6">
          <div class="rounded-xl bg-white border p-3 shadow-sm text-center"><p class="text-xs text-slate-500">Leads today</p><p class="text-xl font-extrabold">28</p></div>
          <div class="rounded-xl bg-white border p-3 shadow-sm text-center"><p class="text-xs text-slate-500">Visits</p><p class="text-xl font-extrabold">12</p></div>
          <div class="rounded-xl bg-white border p-3 shadow-sm text-center"><p class="text-xs text-slate-500">KYC pending</p><p class="text-xl font-extrabold text-amber-600">17</p></div>
          <div class="rounded-xl bg-white border p-3 shadow-sm text-center"><p class="text-xs text-slate-500">Onboarded</p><p class="text-xl font-extrabold text-green-700">9</p></div>
          <div class="rounded-xl bg-white border p-3 shadow-sm text-center col-span-2 lg:col-span-1"><p class="text-xs text-slate-500">Conversion</p><p class="text-xl font-extrabold">24.6%</p></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
</body>
</html>
