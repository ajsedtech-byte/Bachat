<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Ops — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="/js/bachat-lazy-load.js"></script>
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="city_ops">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-2xl font-extrabold">City coverage & heatmap</h1>
            <p class="text-sm text-slate-500 mt-1">Control active service areas and spot demand/supply gaps by city and region.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="export-csv" class="rounded-xl border border-[#0056d2] bg-white px-4 py-2 text-sm font-bold text-[#0056d2]">Export CSV</button>
            <button id="refresh" class="rounded-xl bg-[#0056d2] px-4 py-2 text-sm font-bold text-white">Refresh</button>
          </div>
        </div>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div class="grid lg:grid-cols-3 gap-6 mt-6">
          <section class="lg:col-span-2 rounded-2xl border border-[#e5e7eb] bg-white shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-[#e5e7eb]">
              <h2 class="font-bold">Area heatmap</h2>
              <p class="text-sm text-slate-500 mt-1">Circle size is based on buyers, requests, sellers, drivers, and orders.</p>
            </div>
            <div id="map" class="h-[520px]"></div>
          </section>
          <section class="rounded-2xl border border-[#e5e7eb] bg-white shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-[#e5e7eb]">
              <h2 class="font-bold">Coverage controls</h2>
              <p class="text-sm text-slate-500 mt-1">Mark areas active/inactive and set priority for field teams.</p>
            </div>
            <div id="area-list" class="divide-y divide-slate-100 max-h-[520px] overflow-auto"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var rows = [];
      var map;
      var layers = [];
      var approx = {
        indore: [22.7196, 75.8577],
        bhopal: [23.2599, 77.4126],
        mumbai: [19.076, 72.8777],
        delhi: [28.6139, 77.209],
        pune: [18.5204, 73.8567],
        bengaluru: [12.9716, 77.5946],
      };
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function coords(row, idx) {
        if (Number.isFinite(Number(row.lat)) && Number.isFinite(Number(row.lng))) return [Number(row.lat), Number(row.lng)];
        var base = approx[String(row.city || "").toLowerCase()] || [22.9734, 78.6569];
        var offset = ((idx % 9) - 4) * 0.035;
        return [base[0] + offset, base[1] + (((idx * 3) % 9) - 4) * 0.035];
      }
      function heatColor(score) {
        if (score > 80) return "#dc2626";
        if (score > 35) return "#f59e0b";
        return "#0056d2";
      }
      function drawMap() {
        if (!map) {
          map = L.map("map").setView([22.7196, 75.8577], 11);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
        }
        layers.forEach(function (l) { map.removeLayer(l); });
        layers = [];
        var bounds = [];
        rows.forEach(function (r, i) {
          var m = r.metrics || {};
          var score = Number(m.heat_score || 0);
          var c = coords(r, i);
          bounds.push(c);
          var circle = L.circleMarker(c, {
            radius: Math.max(10, Math.min(44, 8 + Math.sqrt(score || 1) * 4)),
            color: heatColor(score),
            fillColor: heatColor(score),
            fillOpacity: r.active ? 0.32 : 0.12,
            weight: r.active ? 3 : 1,
          }).addTo(map).bindPopup("<strong>" + esc(r.city) + ", " + esc(r.region) + "</strong><br>Heat: " + score + "<br>Buyers: " + (m.buyers || 0) + "<br>Sellers: " + (m.sellers_verified || 0) + " verified<br>Drivers: " + (m.drivers_verified || 0) + " verified");
          layers.push(circle);
        });
        if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
        setTimeout(function () { map.invalidateSize(); }, 50);
      }
      function renderList() {
        var box = document.getElementById("area-list");
        box.innerHTML = rows.length ? "" : '<p class="p-5 text-sm text-slate-500">No city data yet.</p>';
        rows.forEach(function (r) {
          var m = r.metrics || {};
          var el = document.createElement("div");
          el.className = "p-4 space-y-3";
          el.innerHTML =
            '<div class="flex items-start justify-between gap-3"><div><p class="font-extrabold">' + esc(r.city) + '</p><p class="text-sm text-slate-500">' + esc(r.region) + '</p></div><span class="rounded-full px-2 py-1 text-xs font-bold ' + (r.active ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600') + '">' + (r.active ? 'Active' : 'Inactive') + '</span></div>' +
            '<div class="grid grid-cols-3 gap-2 text-center text-sm"><div class="rounded-lg bg-[#f8f9fb] p-2"><b>' + (m.open_requests || 0) + '</b><br><span class="text-slate-500">Open</span></div><div class="rounded-lg bg-[#f8f9fb] p-2"><b>' + (m.sellers_verified || 0) + '</b><br><span class="text-slate-500">Sellers</span></div><div class="rounded-lg bg-[#f8f9fb] p-2"><b>' + (m.drivers_verified || 0) + '</b><br><span class="text-slate-500">Drivers</span></div></div>' +
            '<div class="grid grid-cols-2 gap-2"><select class="priority rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option></select><select class="active rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="true">Active</option><option value="false">Inactive</option></select></div>' +
            '<div class="grid grid-cols-2 gap-2"><input class="lat rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Latitude" value="' + esc(r.lat == null ? '' : r.lat) + '" /><input class="lng rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Longitude" value="' + esc(r.lng == null ? '' : r.lng) + '" /></div>' +
            '<input class="notes w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Ops notes" value="' + esc(r.notes || '') + '" />' +
            '<button class="save w-full rounded-lg bg-[#0056d2] text-white font-bold px-3 py-2 text-sm">Save area control</button>';
          el.querySelector(".priority").value = r.priority || "normal";
          el.querySelector(".active").value = r.active ? "true" : "false";
          el.querySelector(".save").addEventListener("click", async function () {
            await saveArea(r, el);
          });
          box.appendChild(el);
        });
      }
      async function saveArea(row, el) {
        var res = await BachatAdminRuntime.adminFetch("/api/admin/city-ops/area", {
          method: "PATCH",
          headers: BachatAdminRuntime.authHeaders(),
          body: JSON.stringify({
            city: row.city,
            region: row.region,
            active: el.querySelector(".active").value === "true",
            priority: el.querySelector(".priority").value,
            notes: el.querySelector(".notes").value,
            lat: el.querySelector(".lat").value,
            lng: el.querySelector(".lng").value,
            service_radius_km: row.service_radius_km || 5,
          }),
        });
        var d = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(d.error || "Save failed");
        await load();
      }
      async function load() {
        var err = document.getElementById("err");
        err.classList.add("hidden");
        var res = await BachatAdminRuntime.adminFetch("/api/admin/city-ops", { headers: BachatAdminRuntime.authHeaders() });
        var d = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          err.textContent = d.error || "Failed to load city ops.";
          err.classList.remove("hidden");
          return;
        }
        rows = d.items || [];
        renderList();
        drawMap();
      }
      function exportCsv() {
        var cols = ["city", "region", "active", "priority", "lat", "lng", "buyers", "open_requests", "sellers_verified", "drivers_verified", "orders", "heat_score", "notes"];
        var csv = [cols.join(",")].concat(rows.map(function (r) {
          var m = r.metrics || {};
          var flat = Object.assign({}, r, m);
          return cols.map(function (c) { return '"' + String(flat[c] == null ? "" : flat[c]).replace(/"/g, '""') + '"'; }).join(",");
        })).join("\n");
        var url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
        var a = document.createElement("a");
        a.href = url;
        a.download = "bachat-city-ops.csv";
        a.click();
        URL.revokeObjectURL(url);
      }
      (async function () {
        if (!(await BachatAdminRuntime.guardAdminPage())) return;
        document.getElementById("refresh").addEventListener("click", load);
        document.getElementById("export-csv").addEventListener("click", exportCsv);
        await load();
      })();
    })();
  </script>
</body>
</html>
