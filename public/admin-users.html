<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users — Bachat Ops</title>
  <link rel="icon" href="/assets/bachat-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/assets/bachat-theme.css" />
  <link rel="stylesheet" href="/assets/tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="/js/bachat-lazy-load.js"></script>
</head>
<body class="bachat-ui bg-[#f8f9fb] min-h-screen text-slate-900" data-bachat-admin="users">
  <div class="flex min-h-screen">
    <aside data-bachat-sidebar class="w-64 shrink-0 bg-white border-r border-[#e5e7eb] hidden lg:flex flex-col"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header data-bachat-topbar class="min-h-16 px-4 lg:px-6 py-3 flex flex-wrap items-center gap-4 border-b border-[#e5e7eb] bg-white sticky top-0 z-30"></header>
      <main class="flex-1 p-4 lg:p-6 overflow-auto">
        <h1 class="text-2xl font-extrabold">Users</h1>
        <p class="text-slate-500 text-sm mt-1">Live from <code class="text-xs bg-slate-100 px-1 rounded">GET /api/admin/users</code> — search by email, name, or phone.</p>
        <div class="mt-4 flex flex-wrap gap-2 items-center">
          <input id="q" type="search" placeholder="Search…" class="rounded-xl border border-[#e5e7eb] px-3 py-2 text-sm min-w-[200px]" />
          <select id="role" class="rounded-xl border border-[#e5e7eb] px-3 py-2 text-sm">
            <option value="">All roles</option>
            <option value="buyer">buyer</option>
            <option value="seller">seller</option>
            <option value="admin">admin</option>
            <option value="delivery">delivery</option>
          </select>
          <button type="button" id="btn-search" class="rounded-xl bg-[#0056d2] text-white font-bold px-4 py-2 text-sm">Apply</button>
        </div>
        <p id="err" class="hidden mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
        <div class="mt-6 overflow-x-auto rounded-xl border border-[#e5e7eb] bg-white shadow-sm">
          <table class="w-full text-sm text-left min-w-[800px]">
            <thead class="bg-[#f8f9fb] text-xs font-bold text-slate-500 uppercase border-b border-[#e5e7eb]">
              <tr>
                <th class="px-4 py-3">Email</th>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Role</th>
                <th class="px-4 py-3">City</th>
                <th class="px-4 py-3">Verified</th>
                <th class="px-4 py-3">Joined</th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-[#e5e7eb]"></tbody>
          </table>
        </div>
        <div class="mt-4 flex items-center gap-3 text-sm">
          <button type="button" id="prev" class="rounded-xl border border-[#e5e7eb] px-4 py-2 font-bold text-slate-700 disabled:opacity-40">Previous</button>
          <span id="page-lbl" class="text-slate-500"></span>
          <button type="button" id="next" class="rounded-xl border border-[#e5e7eb] px-4 py-2 font-bold text-slate-700 disabled:opacity-40">Next</button>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/bachat-admin-shell.js"></script>
  <script src="/js/bachat-admin-runtime.js"></script>
  <script>
    (function () {
      var skip = 0;
      var limit = 25;
      function esc(s) {
        var t = document.createElement("div");
        t.textContent = s == null ? "" : String(s);
        return t.innerHTML;
      }
      function fmt(d) {
        if (!d) return "—";
        try {
          return new Date(d).toISOString().slice(0, 10);
        } catch (_) {
          return "—";
        }
      }
      async function load() {
        var err = document.getElementById("err");
        err.classList.add("hidden");
        var q = encodeURIComponent(document.getElementById("q").value.trim());
        var role = document.getElementById("role").value;
        var qs = "?limit=" + limit + "&skip=" + skip + (q ? "&q=" + q : "") + (role ? "&role=" + encodeURIComponent(role) : "");
        var res = await BachatAdminRuntime.adminFetch("/api/admin/users" + qs, { headers: BachatAdminRuntime.authHeaders() });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          err.textContent = data.error || "Failed to load";
          err.classList.remove("hidden");
          return;
        }
        var tb = document.getElementById("tbody");
        tb.innerHTML = "";
        (data.items || []).forEach(function (u) {
          var tr = document.createElement("tr");
          tr.className = "hover:bg-[#f8f9fb]";
          var ev = u.email_verified_at ? "✓ email" : "—";
          var pv = u.phone_verified_at ? " · ✓ phone" : "";
          tr.innerHTML =
            "<td class=\"px-4 py-3 font-mono text-xs\">" +
            esc(u.email) +
            "</td><td class=\"px-4 py-3\">" +
            esc(u.name) +
            "</td><td class=\"px-4 py-3 font-semibold\">" +
            esc(u.role) +
            "</td><td class=\"px-4 py-3 text-slate-600\">" +
            esc(u.city) +
            "</td><td class=\"px-4 py-3 text-xs\">" +
            esc(ev + pv) +
            "</td><td class=\"px-4 py-3 text-xs text-slate-500\">" +
            esc(fmt(u.created_at)) +
            "</td>";
          tb.appendChild(tr);
        });
        document.getElementById("page-lbl").textContent = "Total " + (data.total || 0) + " · skip " + skip;
        document.getElementById("prev").disabled = skip < 1;
        document.getElementById("next").disabled = !data.items || data.items.length < limit;
      }
      document.getElementById("btn-search").addEventListener("click", function () {
        skip = 0;
        load();
      });
      document.getElementById("prev").addEventListener("click", function () {
        skip = Math.max(0, skip - limit);
        load();
      });
      document.getElementById("next").addEventListener("click", function () {
        skip += limit;
        load();
      });
      (async function () {
        if (!(await BachatAdminRuntime.guardAdminPage())) return;
        load();
      })();
    })();
  </script>
</body>
</html>
